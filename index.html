<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Спорт Мордовии">
  <title>Спорт Мордовии</title>
  <style>
    :root {
      color-scheme: light;
      --text: #182638;
      --sub: #84919e;
      --panel: #ffffff;
      --edge: #e9edf1;
      --chat: #e6efe9;
      --bubble: #ffffff;
      --out: #d9f5cd;
      --accent: #1789cf;
      --accent-hover: #1075b8;
      --key: #ffffff;
      --key-shadow: 0 1px 3px rgba(26,53,71,.08);
      --field: #f0f2f5;
      --banner: #c9d7c9;
      --shadow: 0 9px 36px rgba(29,65,66,.09);
    }
    body[data-theme="dark"] {
      color-scheme: dark;
      --text: #f0f2f5;
      --sub: #a0aab6;
      --panel: #1e2632;
      --edge: #2e3a47;
      --chat: #17212c;
      --bubble: #243242;
      --out: #335f53;
      --accent: #70bdff;
      --accent-hover: #b4dcff;
      --key: #29394c;
      --key-shadow: 0 1px 3px rgba(0,0,0,.07);
      --field: #2a3542;
      --banner: #324753;
      --shadow: 0 6px 25px rgba(0,0,0,.15);
    }
    *, *::before, *::after {box-sizing:border-box}
    html, body {margin:0;min-height:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);font-size:15px}
    body {background:#d9e7e3}
    button,input {font:inherit}
    button {cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    button:focus-visible,input:focus-visible {outline:2px solid var(--accent);outline-offset:2px}
    svg {display:block;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;width:23px;height:23px;flex:0 0 auto}
    .shell {width:100%;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--panel)}
    .hidden {display:none!important}
    .topbar {flex:0 0 64px;display:flex;align-items:center;gap:12px;background:var(--panel);padding:0 13px 0 8px;border-bottom:1px solid var(--edge);z-index:4}
    .plain-icon {width:40px;height:42px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--text);padding:0}
    .plain-icon:hover {background:var(--field)}
    .avatar {width:43px;height:43px;border-radius:50%;flex:0 0 auto;background:linear-gradient(150deg,#22b5b1,#188ed0 75%);display:grid;place-items:center;font-size:23px;color:white;box-shadow:inset 0 0 0 1px rgba(255,255,255,.17)}
    .avatar.small {width:30px;height:30px;font-size:17px}
    .head-info {flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
    .head-info strong {font-size:16px;line-height:20px;letter-spacing:-.28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:670}
    .head-info span {font-size:13px;color:var(--sub);line-height:17px}
    .chat-background {min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative;background-color:var(--chat);
      background-image: radial-gradient(ellipse at 17% 8%,rgba(255,255,255,.12),transparent 54%),
      radial-gradient(ellipse at 80% 88%,rgba(102,161,144,.09),transparent 50%);}
    .chat-background::-webkit-scrollbar {width:5px}
    .chat-background::-webkit-scrollbar-thumb {background:rgba(85,113,119,.16);border-radius:10px}
    .thread {min-height:100%;padding:14px 12px 20px;display:flex;flex-direction:column;gap:13px;max-width:660px;margin:0 auto}
    .thread::before {content:"";flex:1 0 6px}
    .day-pill {align-self:center;font-size:12px;font-weight:550;line-height:20px;padding:2px 12px;background:rgba(85,133,131,.35);color:white;border-radius:20px;margin-bottom:3px}
    .message {display:flex;align-items:flex-end;gap:7px;max-width:100%}
    .message.bot {align-self:flex-start;width:min(100%,375px)}
    .message.outgoing {align-self:flex-end;justify-content:flex-end;max-width:85%}
    .message .avatar {margin-bottom:4px}
    .message-content {min-width:0;max-width:100%;flex:1;display:flex;flex-direction:column;gap:5px}
    .bubble {background:var(--bubble);box-shadow:var(--key-shadow);border-radius:15px 15px 15px 6px;padding:13px 13px 7px;overflow-wrap:anywhere;min-width:0}
    .bubble-title {font-size:15px;line-height:1.45;letter-spacing:-.12px;font-weight:700;margin-bottom:10px;white-space:pre-wrap}
    .bubble-body {font-size:14px;line-height:1.52;white-space:pre-wrap;overflow-wrap:anywhere}
    .meta {text-align:right;color:var(--sub);font-size:10.5px;line-height:14px;margin-top:8px;user-select:none}
    .keyboard {display:flex;flex-direction:column;gap:4px;min-width:0}
    .key-row {display:flex;gap:4px;min-width:0}
    .inline-button {flex:1;min-width:0;border:0;border-radius:8px;background:var(--key);color:var(--accent);padding:10px 6px;min-height:43px;font-size:13.5px;line-height:1.32;font-weight:615;text-align:center;box-shadow:var(--key-shadow);transition:background .15s,transform .1s;white-space:normal;overflow-wrap:break-word}
    .inline-button:hover {background:var(--field)}
    .inline-button:active {transform:scale(.985)}
    .inline-button.nav {font-weight:570}
    .message.outgoing .bubble {border-radius:16px 16px 5px 16px;background:var(--out);padding:10px 12px 6px;min-width:72px}
    .outgoing-text {font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
    .outgoing .meta {color:rgba(56,102,101,.7)}
    body[data-theme="dark"] .outgoing .meta {color:#a9d8ce}
    .composer {flex:0 0 auto;z-index:3;background:var(--panel);display:flex;align-items:center;gap:8px;padding:9px 11px calc(9px + env(safe-area-inset-bottom, 0px));border-top:1px solid var(--edge)}
    .menu-button {flex:0 0 auto;border:0;background:var(--field);border-radius:17px;padding:9px 12px;min-height:38px;color:var(--accent);font-size:13px;font-weight:650;display:flex;align-items:center;gap:4px}
    .menu-button svg {width:17px;height:17px}
    .input-wrap {flex:1;min-width:0;background:var(--field);border-radius:22px;min-height:40px;display:flex;align-items:center;padding:0 7px 0 14px}
    #message {background:transparent;border:0;outline:0;min-width:0;width:100%;height:40px;font-size:15px;color:var(--text)}
    #message::placeholder {color:var(--sub)}
    #send {height:31px;width:31px;border-radius:50%;border:0;color:#fff;background:#258bd0;display:grid;place-items:center;flex:0 0 auto;opacity:.5;transition:opacity .12s}
    #send.ready {opacity:1}
    #send svg {width:18px;height:18px;stroke-width:2.4}
    .list-screen {flex:1;min-height:0;background:var(--panel);display:flex;flex-direction:column}
    .list-header {padding:22px 20px 18px;border-bottom:1px solid var(--edge)}
    .list-header h1 {font-size:30px;line-height:1.1;margin:0 0 18px;letter-spacing:-.8px}
    .search-row {background:var(--field);border-radius:11px;display:flex;align-items:center;gap:8px;color:var(--sub);padding:0 12px;height:39px}
    .search-row svg {width:18px;height:18px}
    #search {border:0;outline:0;background:transparent;color:var(--text);width:100%;height:100%;font-size:15px}
    .chat-link {padding:14px 18px;display:flex;align-items:center;gap:12px;background:transparent;border:0;border-bottom:1px solid var(--edge);text-align:left;width:100%;color:var(--text)}
    .chat-link .avatar {width:54px;height:54px;font-size:27px}
    .chat-link strong {font-size:16px}
    .chat-link small {display:block;color:var(--sub);font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat-link .info {flex:1;min-width:0}
    .dropdown {position:absolute;z-index:9;top:59px;right:10px;min-width:208px;background:var(--panel);border-radius:14px;box-shadow:0 12px 35px rgba(13,31,49,.18);padding:6px;border:1px solid var(--edge)}
    .dropdown button {background:transparent;border:0;border-radius:9px;display:block;width:100%;text-align:left;color:var(--text);font-size:14px;padding:12px}
    .dropdown button:hover {background:var(--field)}
    .veil {position:absolute;inset:0;z-index:8;background:transparent}
    .toast {position:absolute;bottom:82px;left:50%;transform:translateX(-50%);background:rgba(17,37,52,.91);color:#fff;border-radius:12px;box-shadow:var(--shadow);z-index:11;font-size:13px;padding:10px 16px;white-space:nowrap;max-width:90%;text-align:center}
    @media(min-width:620px) {
      body {background:radial-gradient(circle at 18% 20%,#eef5eb 0%,transparent 35%),radial-gradient(circle at 82% 75%,#d3e8e3 0%,transparent 38%),#d9e6eb;display:grid;place-items:center;padding:18px}
      .shell {height:min(850px,calc(100dvh - 36px));width:440px;max-width:100%;border-radius:24px;box-shadow:0 25px 90px rgba(27,53,68,.23);border:1px solid rgba(255,255,255,.75)}
      .thread {padding-left:12px;padding-right:12px}
    }
    @media(max-width:380px) {
      .topbar {gap:8px;padding-right:8px}
      .head-info strong {font-size:15px}
      .thread {padding:12px 9px 16px}
      .message.bot {width:100%}
      .inline-button {font-size:12.75px;padding:9px 4px}
      .bubble {padding-left:11px;padding-right:11px}
      .menu-button {padding:8px 9px}
    }
    @media(prefers-reduced-motion:reduce) {*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="arrow-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="ellipsis" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="send-icon" viewBox="0 0 24 24"><path d="M12 20V4m-7 7 7-7 7 7"/></symbol>
    <symbol id="menu-icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="search-icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></symbol>
  </svg>
  <div class="shell" id="shell">
    <section class="list-screen hidden" id="list-screen" aria-label="Чаты">
      <div class="list-header"><h1>Чаты</h1><div class="search-row"><svg><use href="#search-icon"/></svg><input type="search" id="search" placeholder="Поиск" aria-label="Поиск"></div></div>
      <button class="chat-link" id="open-chat"><span class="avatar">🏆</span><span class="info"><strong>Спорт Мордовии</strong><small>Приветствуем вас! Выберите интересующий раздел.</small></span></button>
    </section>
    <section class="chat-screen" id="chat-screen" style="display:flex;min-height:0;flex:1;flex-direction:column" aria-label="Спорт Мордовии">
      <header class="topbar">
        <button class="plain-icon" id="back-to-list" aria-label="К списку чатов"><svg><use href="#arrow-left"/></svg></button>
        <span class="avatar">🏆</span>
        <span class="head-info"><strong>Спорт Мордовии</strong><span>бот</span></span>
        <button class="plain-icon" id="more-button" aria-label="Ещё"><svg><use href="#ellipsis"/></svg></button>
      </header>
      <main class="chat-background" id="chat-scroll">
        <div class="thread" id="thread"><span class="day-pill">Сегодня</span></div>

      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="menu-button" id="menu-bottom"><svg><use href="#menu-icon"/></svg>Меню</button>
        <div class="input-wrap"><input type="text" id="message" placeholder="Сообщение" maxlength="500" aria-label="Сообщение"><button id="send" type="submit" aria-label="Отправить"><svg><use href="#send-icon"/></svg></button></div>
      </form>
    </section>
    <div id="popup-root"></div>
    <div class="toast hidden" id="toast" role="status"></div>
  </div>
  <script id="bot-pages" type="application/json">{"home":{"title":"🏆 Спорт Мордовии","body":"Приветствуем вас!\n\nЯ — цифровой помощник Министерства спорта Республики Мордовия.\n\nПомогу найти спортивные мероприятия, узнать о комплексе ГТО, поступлении в спортивные школы и государственных услугах.\n\nЧто вас интересует?","buttons":[["📅 Афиша","events"],["🏅 ГТО","gto"],["🏫 Школы","schools"],["📄 Услуги","services"],["🎖 Помощь","support"],["🏛 Минспорт","ministry"],["☎️ Контакты","feedback"]]},"events":{"title":"📅 Афиша мероприятий","body":"Спортивная жизнь Мордовии — в одном месте!\n\nВыбирайте соревнования, фестивали и физкультурные мероприятия для всей семьи.\n\nБлижайшие события и календарь:","buttons":[["Ближайшие события","upcoming"],["Ноябрь 2026","november"],["Декабрь 2026","december"]]},"upcoming":{"title":"🏟 Ближайшие события","body":"📅 14 ноября, 11:00\n🏐 Кубок Саранска по волейболу\n\n📅 21 ноября, 10:00\n🏅 Семейный фестиваль ГТО\n\n📅 28 ноября, 12:00\n🥋 Первенство Мордовии по дзюдо\n\n📅 5 декабря, 11:00\n⛸ Фестиваль зимнего спорта\n\nВыберите мероприятие:","buttons":[["🏐 Волейбол · 14.11","volley"],["🏅 ГТО · 21.11","festival"],["🥋 Дзюдо · 28.11","judo"],["⛸ Зимний спорт · 05.12","winter"]]},"november":{"title":"🗓 Ноябрь 2026","body":"Спортивные мероприятия ноября:\n\n🏐 14 ноября — Кубок Саранска по волейболу\n\n🏅 21 ноября — Семейный фестиваль ГТО\n\n🥋 28 ноября — Первенство Мордовии по дзюдо\n\nВыберите событие:","buttons":[["14 ноября · Волейбол","volley"],["21 ноября · ГТО","festival"],["28 ноября · Дзюдо","judo"]]},"december":{"title":"🗓 Декабрь 2026","body":"Спортивные мероприятия декабря:\n\n⛸ 5 декабря — Фестиваль зимнего спорта\n\n🏊 12 декабря — Соревнования по плаванию\n\n🏓 19 декабря — Новогодний турнир по настольному теннису","buttons":[["05.12 · Зимний спорт","winter"],["12.12 · Плавание","swim"],["19.12 · Теннис","tennis"]]},"volley":{"title":"🏐 Кубок по волейболу","body":"Открытый кубок Саранска по волейболу среди любительских команд.\n\n📅 14 ноября 2026 года\n🕚 11:00\n📍 Саранск, спорткомплекс «Старт»\n\nВ программе — групповые матчи, полуфиналы и финал.\n\n🎟 Вход для зрителей свободный.","buttons":[["Другие мероприятия","upcoming"]]},"festival":{"title":"🏅 Семейный фестиваль ГТО","body":"Приглашаем семьи на спортивный праздник!\n\n📅 21 ноября 2026 года\n🕙 10:00\n📍 Саранск, ул. Студенческая, 11Б\n\nВ программе:\n• спортивные испытания;\n• семейные эстафеты;\n• консультации по ГТО;\n• награждение участников.\n\nУчастие по предварительной записи.","buttons":[["Центр тестирования","center1"],["Как сдать ГТО","gtohow"]]},"judo":{"title":"🥋 Первенство по дзюдо","body":"Первенство Республики Мордовия по дзюдо среди юношей и девушек.\n\n📅 28 ноября 2026 года\n🕛 12:00\n📍 Саранск, зал СШОР\n\nСоревнования в разных весовых категориях и награждение победителей.\n\n🎟 Для зрителей вход свободный.","buttons":[["Все мероприятия","upcoming"]]},"winter":{"title":"⛸ Фестиваль зимнего спорта","body":"Зимний спортивный праздник для всей семьи!\n\n📅 5 декабря 2026 года\n🕚 11:00\n📍 Саранск, Ледовый дворец\n\nВ программе:\n• показательные выступления;\n• мастер-классы;\n• семейные активности;\n• массовое катание.","buttons":[["Декабрьские события","december"]]},"swim":{"title":"🏊 Соревнования по плаванию","body":"Открытые соревнования среди учащихся спортивных школ.\n\n📅 12 декабря 2026 года\n🕙 10:00\n📍 Саранск, плавательный бассейн спортивного комплекса\n\nДистанции 50 и 100 метров различными стилями.","buttons":[["Декабрьские события","december"]]},"tennis":{"title":"🏓 Новогодний турнир","body":"Открытый турнир по настольному теннису.\n\n📅 19 декабря 2026 года\n🕚 11:00\n📍 Саранск, спортивный центр\n\nЛичные соревнования и праздничное награждение победителей.","buttons":[["Декабрьские события","december"]]},"gto":{"title":"🏅 Комплекс ГТО","body":"«Готов к труду и обороне» — комплекс испытаний для людей разных возрастов.\n\nВыполняйте нормативы, проверяйте физическую подготовку и получайте знаки отличия!\n\nВыберите интересующую тему:","buttons":[["Как сдать ГТО","gtohow"],["Центры тестирования","gtocenters"],["Нормативы","gtonorms"],["Частые вопросы","gtofaq"],["Официальный сайт ↗","url:https://www.gto.ru/"]]},"gtohow":{"title":"🏅 Как сдать нормативы ГТО","body":"Чтобы принять участие в комплексе ГТО:\n\n1️⃣ Зарегистрируйтесь в информационной системе ГТО.\n\n2️⃣ Ознакомьтесь с нормативами своей возрастной ступени.\n\n3️⃣ Получите необходимый медицинский допуск.\n\n4️⃣ Обратитесь в центр тестирования и узнайте дату испытаний.\n\n5️⃣ Выполните нормативы в установленном порядке.","buttons":[["Центры тестирования","gtocenters"],["Нормативы","gtonorms"],["Официальный сайт ↗","url:https://www.gto.ru/"]]},"gtocenters":{"title":"📍 Центры тестирования ГТО","body":"Центры тестирования в Саранске:\n\n1. ул. Студенческая, 11Б\n☎️ +7 (8342) 33-93-28\n\n2. ул. Б. Хмельницкого, 57\n☎️ +7 (8342) 47-48-34\n\n3. ул. Энергетическая, 28\n☎️ +7 (8342) 29-35-72\n\nВыберите интересующий центр:","buttons":[["Студенческая, 11Б","center1"],["Б. Хмельницкого, 57","center2"],["Энергетическая, 28","center3"],["Все центры ↗","url:https://www.gto.ru/"]]},"center1":{"title":"📍 Центр тестирования ГТО","body":"г. Саранск, ул. Студенческая, 11Б\n\n☎️ +7 (8342) 33-93-28\n✉️ centergtorm@mail.ru\n\nУточняйте порядок допуска, необходимые документы и график испытаний.","buttons":[["Все центры","gtocenters"],["Как сдать ГТО","gtohow"]]},"center2":{"title":"📍 Центр тестирования ГТО","body":"г. Саранск, ул. Богдана Хмельницкого, 57\n\n☎️ +7 (8342) 47-48-34\n✉️ Saransk-sport@e-mordovia.ru\n\nДля записи на испытания обратитесь по указанным контактам.","buttons":[["Все центры","gtocenters"]]},"center3":{"title":"📍 Центр тестирования ГТО","body":"г. Саранск, ул. Энергетическая, 28\n\n☎️ +7 (8342) 29-35-72\n✉️ dosaaf_rm@mail.ru\n\nУточняйте расписание испытаний и порядок допуска.","buttons":[["Все центры","gtocenters"]]},"gtonorms":{"title":"📋 Нормативы ГТО","body":"Нормативы комплекса ГТО различаются по возрастным ступеням.\n\nИспытания могут включать:\n\n🏃 Бег на короткие и длинные дистанции\n💪 Силовые упражнения\n🤸 Наклоны на гибкость\n🏊 Плавание\n🎯 Другие испытания по возрасту\n\nАктуальные нормативы размещены на официальном сайте.","buttons":[["Посмотреть нормативы ↗","url:https://www.gto.ru/"],["Как сдать ГТО","gtohow"]]},"gtofaq":{"title":"❓ Частые вопросы о ГТО","body":"Ответы на распространённые вопросы участников комплекса ГТО.\n\nВыберите вопрос:","buttons":[["Какие нужны документы?","gtodocs"],["Где пройти испытания?","gtocenters"],["Что даёт знак ГТО?","gtobenefits"],["Как узнать результаты?","gtoresults"]]},"gtodocs":{"title":"📄 Документы для ГТО","body":"Для участия обычно необходимы:\n\n• документ, удостоверяющий личность;\n• учётные сведения участника;\n• медицинское заключение о допуске;\n• документы законного представителя, если это требуется.\n\nТочный перечень уточняйте в центре тестирования.","buttons":[["Центры тестирования","gtocenters"]]},"gtobenefits":{"title":"🏅 Знак отличия ГТО","body":"За успешное выполнение требований предусмотрены золотой, серебряный и бронзовый знаки отличия.\n\nВ установленных случаях выполнение нормативов ГТО может давать дополнительные преимущества при поступлении в вуз и при получении налогового вычета.","buttons":[["Вычет за ГТО","taxgto"],["Нормативы","gtonorms"]]},"gtoresults":{"title":"📊 Результаты ГТО","body":"Результаты выполненных испытаний учитываются в информационной системе ГТО.\n\nУточнить сведения о результатах и знаке отличия можно через официальный сервис или центр тестирования.","buttons":[["Сервис ГТО ↗","url:https://www.gto.ru/"],["Центры тестирования","gtocenters"]]},"schools":{"title":"🏫 Спортивные школы","body":"Хотите записать ребёнка в спортивную школу?\n\nРасскажем, с чего начать, какие документы подготовить и куда обратиться.","buttons":[["Выбрать спортшколу","schoollist"],["Порядок поступления","schoolhow"],["Необходимые документы","schooldocs"]]},"schoollist":{"title":"🏫 Спортивные школы Мордовии","body":"Спортивные школы Саранска:\n\n🥊 СШОР по боксу имени Олега Маскаева\n\n🤸 СШОР по спортивной гимнастике Л. Я. Аркаева\n\n⛸ СШОР по зимним видам спорта\n\n🏃 СШОР по лёгкой атлетике\n\nВыберите школу:","buttons":[["🥊 Бокс","schoolboxing"],["🤸 Гимнастика","schoolgym"],["⛸ Зимние виды","schoolwinter"],["🏃 Лёгкая атлетика","schoolathletics"]]},"schoolboxing":{"title":"🥊 СШОР по боксу","body":"Спортивная школа олимпийского резерва по боксу имени Олега Маскаева.\n\nОсновное направление — спортивная подготовка по боксу.\n\nУсловия набора, возрастные группы и порядок приёма уточняйте в учреждении.","buttons":[["Как поступить","schoolhow"],["Другие школы","schoollist"]]},"schoolgym":{"title":"🤸 СШОР по гимнастике","body":"Спортивная школа олимпийского резерва по спортивной гимнастике Л. Я. Аркаева.\n\n📍 Саранск, ул. Ульянова, 24Б, корп. 1\n\nНаправление подготовки — спортивная гимнастика.","buttons":[["Как поступить","schoolhow"],["Другие школы","schoollist"]]},"schoolwinter":{"title":"⛸ СШОР по зимним видам спорта","body":"Спортивная школа олимпийского резерва по зимним видам спорта.\n\n📍 Саранск, ул. Энгельса, 31\n\nИнформация о тренировочных группах и условиях набора предоставляется учреждением.","buttons":[["Как поступить","schoolhow"],["Другие школы","schoollist"]]},"schoolathletics":{"title":"🏃 СШОР по лёгкой атлетике","body":"Спортивная школа олимпийского резерва по лёгкой атлетике.\n\n📍 Саранск, ул. Победы, 3А\n\nВозрастные группы и условия набора уточняйте в спортивной школе.","buttons":[["Как поступить","schoolhow"],["Другие школы","schoollist"]]},"schoolhow":{"title":"🎓 Порядок поступления","body":"Чтобы записать ребёнка в спортивную школу:\n\n1. Выберите вид спорта и учреждение.\n2. Уточните возрастные требования и наличие набора.\n3. Подготовьте документы.\n4. Подайте заявление по правилам школы.\n5. Пройдите необходимый отбор и медицинский допуск.\n\nПорядок может отличаться в зависимости от учреждения.","buttons":[["Список школ","schoollist"],["Документы","schooldocs"]]},"schooldocs":{"title":"📄 Документы для поступления","body":"Для поступления могут потребоваться:\n\n• заявление о приёме;\n• свидетельство о рождении или паспорт;\n• документ родителя или законного представителя;\n• медицинское заключение, если необходимо;\n• другие документы по правилам школы.\n\nУточняйте перечень в выбранной организации.","buttons":[["Список школ","schoollist"]]},"services":{"title":"📄 Государственные услуги","body":"Информация о предоставлении услуг в сфере физической культуры и спорта.\n\nВыберите интересующую тему:","buttons":[["Спортивные разряды","ranks"],["Судейские категории","judges"],["Налоговые вычеты","tax"],["Порядок обращения","appeal"]]},"ranks":{"title":"🏆 Спортивные разряды","body":"Присвоение и подтверждение спортивных разрядов осуществляются по установленным требованиям.\n\nУчитываются результаты соревнований, выполнение нормативов и представленные документы.\n\nПодробнее о подаче документов можно узнать в Министерстве спорта Республики Мордовия.","buttons":[["Контакты Минспорта","contacts"],["Судейские категории","judges"]]},"judges":{"title":"🏅 Судейские категории","body":"Квалификационные категории спортивных судей присваиваются в соответствии с действующими требованиями.\n\nДля подачи документов необходимо уточнить:\n\n• основания присвоения;\n• подтверждающие документы;\n• порядок подачи представления;\n• сроки рассмотрения.","buttons":[["Контакты Минспорта","contacts"]]},"tax":{"title":"💳 Налоговые вычеты","body":"За занятия спортом и выполнение нормативов ГТО при соблюдении установленных условий могут предоставляться налоговые вычеты.\n\nВыберите тему:","buttons":[["За занятия спортом","taxsport"],["За выполнение ГТО","taxgto"]]},"taxsport":{"title":"💳 Вычет за занятия спортом","body":"Часть расходов на физкультурно-оздоровительные услуги можно учесть при получении социального налогового вычета.\n\nОсновные условия:\n• услуга включена в установленный перечень;\n• организация соответствует требованиям;\n• расходы подтверждены документами;\n• соблюдены условия НК РФ.","buttons":[["Подробнее на сайте ФНС ↗","url:https://www.nalog.gov.ru/"]]},"taxgto":{"title":"🏅 Налоговый вычет за ГТО","body":"Предусмотрен стандартный налоговый вычет за выполнение нормативов ГТО при соблюдении установленных условий.\n\nРазмер вычета — 18 000 ₽ налоговой базы за год. При ставке НДФЛ 13% это соответствует уменьшению налога на 2 340 ₽.\n\nДля вычета необходимо выполнение требований к знаку отличия и диспансеризации.","buttons":[["Подробнее на сайте ФНС ↗","url:https://www.nalog.gov.ru/"],["Комплекс ГТО","gto"]]},"support":{"title":"🎖 Поддержка участников СВО","body":"Информация для участников СВО и членов их семей по вопросам занятий физической культурой и спортом.\n\nМожно узнать о спортивных учреждениях, адаптивной физкультуре и возможности получить консультацию.","buttons":[["Спортивные учреждения","schoollist"],["Адаптивный спорт","adaptive"],["Консультация","contacts"]]},"adaptive":{"title":"♿ Адаптивная физкультура","body":"Адаптивная физическая культура помогает поддерживать активность с учётом индивидуальных возможностей человека.\n\nПри выборе занятий учитывайте медицинские рекомендации и доступные программы.\n\nЗа консультацией можно обратиться в Министерство спорта Республики Мордовия.","buttons":[["Контакты Минспорта","contacts"]]},"ministry":{"title":"🏛 Министерство спорта РМ","body":"Министерство спорта Республики Мордовия осуществляет полномочия в сфере физической культуры и спорта.\n\nОсновные направления:\n• развитие массового спорта;\n• подготовка спортивного резерва;\n• поддержка спортивных организаций;\n• организация спортивных мероприятий.","buttons":[["Контакты","contacts"],["Спортивные школы","schoollist"],["Официальный сайт ↗","url:https://e-mordovia.ru/gosudarstvennaya-vlast-rm/ministerstva-i-vedomstva/minsport/"]]},"feedback":{"title":"☎️ Связаться с Минспортом","body":"Министерство спорта Республики Мордовия\n\n📍 Саранск, ул. Коммунистическая, 33/3\n☎️ +7 (8342) 39-14-56\n✉️ komsport@e-mordovia.ru\n\nДля направления официального обращения воспользуйтесь предусмотренным законом каналом.","buttons":[["Контактные данные","contacts"],["Порядок обращения","appeal"],["Официальный сайт ↗","url:https://e-mordovia.ru/gosudarstvennaya-vlast-rm/ministerstva-i-vedomstva/minsport/"]]},"contacts":{"title":"☎️ Контакты Министерства","body":"Министерство спорта Республики Мордовия\n\n📍 Республика Мордовия, г. Саранск, ул. Коммунистическая, д. 33/3\n\n☎️ +7 (8342) 39-14-56\n✉️ komsport@e-mordovia.ru\n\nОфициальный сайт доступен по кнопке ниже.","buttons":[["Официальный сайт ↗","url:https://e-mordovia.ru/gosudarstvennaya-vlast-rm/ministerstva-i-vedomstva/minsport/"],["Направить обращение","appeal"]]},"appeal":{"title":"✉️ Обращение в Министерство","body":"Для направления официального обращения используйте предусмотренные законодательством электронные каналы.\n\nИзложите суть вопроса и укажите сведения, необходимые для получения ответа.\n\nИнформация о действующем порядке подачи обращений размещена на официальных ресурсах ведомства.","buttons":[["Сайт Министерства ↗","url:https://e-mordovia.ru/gosudarstvennaya-vlast-rm/ministerstva-i-vedomstva/minsport/"],["Контакты","contacts"]]}}</script>
  <script>
    (()=>{
      'use strict';
      const pages = JSON.parse(document.getElementById('bot-pages').textContent);
      const $ = id => document.getElementById(id);
      const clock = () => new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
      const history = [];
      let toastTimer;
      let popupOpen = false;
      const scrollBottom = () => requestAnimationFrame(() => {const area=$('chat-scroll'); area.scrollTop=area.scrollHeight;});
      function toast(text){
        const el=$('toast'); el.textContent=text; el.classList.remove('hidden');
        clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2200);
      }
      function makeButton(label,target,screen,isNav=false){
        const button=document.createElement('button');button.type='button';
        button.className='inline-button'+(isNav?' nav':'');button.textContent=label;
        button.addEventListener('click',()=>navigate(screen,target));return button;
      }
      function row(items,screen,isNav=false){
        const wrap=document.createElement('div');wrap.className='key-row';
        items.forEach(item=>wrap.append(makeButton(item[0],item[1],screen,isNav)));
        return wrap;
      }
      function keyboard(screen){
        const data=pages[screen.pageId]||pages.home;
        const result=[];
        const buttons=data.buttons||[];
        if(screen.pageId==='home'){
          for(let n=0;n<buttons.length;n+=2)result.push(buttons.slice(n,n+2));
        } else {buttons.forEach(b=>result.push([b]));}
        result.forEach(r=>screen.keyboard.append(row(r,screen)));
        if(screen.pageId!=='home'){
          const prev=screen.path.at(-1);
          const nav=(prev && prev!=='home')
            ? [['← Назад','nav:back'],['⌂ Меню','nav:home']]
            : [['⌂ Главное меню','nav:home']];
          screen.keyboard.append(row(nav,screen,true));
        }
      }
      function render(screen){
        const data=pages[screen.pageId]||pages.home;
        screen.title.textContent=data.title;
        screen.body.textContent=data.body;
        screen.time.textContent=clock();
        screen.keyboard.replaceChildren();keyboard(screen);
      }
      function botMessage(pageId='home',path=[]){
        const entry=document.createElement('div');entry.className='message bot';
        const avatar=document.createElement('span');avatar.className='avatar small';avatar.textContent='🏆';
        const content=document.createElement('div');content.className='message-content';
        const bubble=document.createElement('div');bubble.className='bubble';
        const title=document.createElement('div');title.className='bubble-title';
        const body=document.createElement('div');body.className='bubble-body';
        const meta=document.createElement('div');meta.className='meta';
        const kb=document.createElement('div');kb.className='keyboard';
        bubble.append(title,body,meta);content.append(bubble,kb);entry.append(avatar,content);
        const screen={pageId,path:[...path],entry,title,body,time:meta,keyboard:kb};
        history.push(screen);$('thread').append(entry);render(screen);scrollBottom();return screen;
      }
      function userMessage(text){
        const entry=document.createElement('div');entry.className='message outgoing';
        const bubble=document.createElement('div');bubble.className='bubble';
        const label=document.createElement('div');label.className='outgoing-text';label.textContent=text;
        const meta=document.createElement('div');meta.className='meta';meta.textContent=clock()+' ✓✓';
        bubble.append(label,meta);entry.append(bubble);$('thread').append(entry);scrollBottom();
      }
      function navigate(screen,target){
        if(target.startsWith('url:')){
          const url=target.slice(4);
          if(/^https:\/\/[^\s]+$/i.test(url))window.open(url,'_blank','noopener,noreferrer');
          else toast('Ссылка недоступна');
          return;
        }
        if(target==='nav:home'){
          screen.pageId='home';screen.path=[];
        } else if(target==='nav:back'){
          screen.pageId=screen.path.pop()||'home';
        } else if(Object.hasOwn(pages,target)){
          screen.path.push(screen.pageId);
          if(screen.path.length>20)screen.path.shift();
          screen.pageId=target;
        } else {toast('Раздел недоступен');return;}
        render(screen);
        requestAnimationFrame(()=>{
          if(history.at(-1)===screen)scrollBottom();
          else screen.entry.scrollIntoView({block:'nearest',behavior:'smooth'});
        });
      }
      function routeText(value){
        const s=value.toLowerCase().replaceAll('ё','е');
        const keywords=[
          [['гто'],'gto'],[['афиш','мероприят','турнир','соревнован'],'events'],
          [['школ','ребен','поступ'],'schools'],[['услуг','разряд','судей','вычет'],'services'],
          [['сво','поддерж','адаптив'],'support'],[['контакт','телефон','адрес','связ'],'feedback'],
          [['министерств','минспорт'],'ministry']
        ];
        for(const [parts,page] of keywords)if(parts.some(word=>s.includes(word)))return page;
        return 'home';
      }
      function helpMessage(){
        const sc=botMessage('home');
        sc.title.textContent='🏆 Спорт Мордовии';
        sc.body.textContent='Нажимайте кнопки для перехода по разделам. Команда /menu откроет главное меню.';
        sc.keyboard.replaceChildren(row([['⌂ Главное меню','nav:home']],sc,true));
      }
      function submitMessage(value){
        const message=value.trim();if(!message)return;
        userMessage(message);
        const cmd=message.startsWith('/')?message.split(/\s+/)[0].split('@')[0].toLowerCase():'';
        if(cmd==='/help')helpMessage();
        else if(['/start','/menu','/reset'].includes(cmd))botMessage('home');
        else if(message.length<=256)botMessage(routeText(message));
        else toast('Сообщение слишком длинное');
      }
      function changeTheme(){
        const dark=document.body.dataset.theme==='dark';
        document.body.dataset.theme=dark?'light':'dark';
        document.querySelector('meta[name="theme-color"]').content=dark?'#ffffff':'#1e2632';
        try{localStorage.setItem('sport-mordovii-theme',document.body.dataset.theme);}catch{}
      }
      function closePopup(){ $('popup-root').replaceChildren();popupOpen=false; }
      function openPopup(){
        if(popupOpen){closePopup();return;}
        const veil=document.createElement('div');veil.className='veil';veil.addEventListener('click',closePopup);
        const menu=document.createElement('div');menu.className='dropdown';
        const choices=[
          ['Главное меню',()=>botMessage('home')],
          ['Контакты',()=>botMessage('contacts')],
          [document.body.dataset.theme==='dark'?'Светлая тема':'Тёмная тема',changeTheme]
        ];
        choices.forEach(([label,cb])=>{
          const btn=document.createElement('button');btn.type='button';btn.textContent=label;
          btn.addEventListener('click',()=>{closePopup();cb();});menu.append(btn);
        });
        $('popup-root').append(veil,menu);popupOpen=true;
      }
      function listMode(show){
        $('list-screen').classList.toggle('hidden',!show);
        $('chat-screen').classList.toggle('hidden',show);
        if(!show)scrollBottom();
      }
      $('composer').addEventListener('submit',e=>{
        e.preventDefault();const input=$('message');const text=input.value;input.value='';$('send').classList.remove('ready');submitMessage(text);
      });
      $('message').addEventListener('input',e=>$('send').classList.toggle('ready',Boolean(e.target.value.trim())));
      $('menu-bottom').addEventListener('click',()=>botMessage('home'));
      $('more-button').addEventListener('click',openPopup);
      $('back-to-list').addEventListener('click',()=>listMode(true));
      $('open-chat').addEventListener('click',()=>listMode(false));
      $('search').addEventListener('input',e=>{
        $('open-chat').classList.toggle('hidden',!('спорт мордовии'.includes(e.target.value.trim().toLowerCase())));
      });
      document.addEventListener('keydown',e=>{
        if(e.key==='Escape'){if(popupOpen)closePopup();else if(!$('list-screen').classList.contains('hidden'))listMode(false);}
      });
      try{
        const theme=localStorage.getItem('sport-mordovii-theme');
        if(theme==='dark')document.body.dataset.theme='dark';
      }catch{}
      botMessage('home');
    })();
  </script>
</body>
</html>
