 taxsport:{title:'💳 Вычет за занятия спортом',body:'Часть расходов на физкультурно-оздоровительные услуги можно учесть при получении социального налогового вычета.\n\nОсновные условия:\n• услуга включена в установленный перечень;\n• организация соответствует требованиям;\n• расходы подтверждены документами;\n• соблюдены условия НК РФ.',buttons:[['Подробнее на сайте ФНС ↗','url:https://www.nalog.gov.ru/']]},
 taxgto:{title:'🏅 Налоговый вычет за ГТО',body:'Предусмотрен стандартный налоговый вычет за выполнение нормативов ГТО при соблюдении установленных условий.\n\nРазмер вычета — 18 000 ₽ налоговой базы за год. При ставке НДФЛ 13% это соответствует уменьшению налога на 2 340 ₽.\n\nДля вычета необходимо выполнение требований к знаку отличия и диспансеризации.',buttons:[['Подробнее на сайте ФНС ↗','url:https://www.nalog.gov.ru/'],['Комплекс ГТО','gto']]},

let current='home',trail=[],pastUser=[],toastTimer=0,displayedList=false;
const by=id=>document.getElementById(id);
const icon=id=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','ico sm');const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#i-'+id);s.append(u);return s};
const time=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function clock(){by('statusTime').textContent=time();by('msgTime').textContent=time();by('chatListTime').textContent=time();}
clock();
function addKey(row,btn,nav=false){const el=document.createElement('button');el.type='button';el.className='key'+(nav?' navkey':'');el.textContent=btn[0];el.addEventListener('click',()=>choose(btn[1]));row.append(el)}
function buttons(rows){const wrap=by('keyboard');wrap.replaceChildren();rows.forEach(r=>{const line=document.createElement('div');line.className='keyrow';r.forEach(b=>addKey(line,b));wrap.append(line)})}
function render(){const data=page[current]||page.home;by('msgTitle').textContent=data.title;by('msgBody').textContent=data.body;const b=data.buttons||[];let rows=[];if(current==='home'){for(let i=0;i<6;i+=2)rows.push(b.slice(i,i+2));rows.push(b.slice(6,7))}else b.forEach(x=>rows.push([x]));if(current!=='home'){rows.push([['← Назад','nav:back'],['⌂ Меню','nav:home']])}buttons(rows);const all=Array.from(by('keyboard').querySelectorAll('button'));if(current!=='home')all.slice(-2).forEach(x=>x.classList.add('navkey'));clock();by('botRow').style.animation='none';void by('botRow').offsetWidth;by('botRow').style.animation='appear .18s ease both';requestAnimationFrame(()=>{by('chatScroll').scrollTop=by('chatScroll').scrollHeight>by('chatScroll').clientHeight+80?0:by('chatScroll').scrollHeight})}
function choose(target){if(target==='nav:back'){back();return}if(target==='nav:home'){home();return}if(target.startsWith('url:')){const url=target.slice(4);window.open(url,'_blank','noopener,noreferrer');return}if(!page[target])return;trail.push(current);current=target;render()}
function back(){if(trail.length){current=trail.pop();render()}else home()}
function home(){current='home';trail=[];render()}
function addUser(text){const row=document.createElement('div');row.className='userrow';const bub=document.createElement('div');bub.className='userbubble';bub.textContent=text;const meta=document.createElement('div');meta.className='msgmeta';meta.textContent=time()+' ✓✓';bub.append(meta);row.append(bub);by('sentMessages').append(row);if(by('sentMessages').childElementCount>3)by('sentMessages').firstElementChild.remove()}
function sendMessage(){const value=by('messageInput').value.trim();if(!value)return;by('messageInput').value='';by('composeForm').classList.remove('has-text');by('messageInput').blur();addUser(value);const s=value.toLowerCase().replaceAll('ё','е');let target='home';if(s.includes('гто'))target='gto';else if(s.includes('афиш')||s.includes('мероприят'))target='events';else if(s.includes('школ')||s.includes('ребен'))target='schools';else if(s.includes('услуг')||s.includes('разряд'))target='services';else if(s.includes('сво')||s.includes('поддерж'))target='support';else if(s.includes('контакт')||s.includes('телефон')||s.includes('адрес'))target='contacts';else if(s.includes('министерств')||s.includes('минспорт'))target='ministry';trail.push(current);current=target;render()}
by('composeForm').addEventListener('submit',e=>{e.preventDefault();sendMessage()});
by('messageInput').addEventListener('input',()=>by('composeForm').classList.toggle('has-text',Boolean(by('messageInput').value.trim())));
function showChats(){by('chatScreen').classList.add('hidden');by('listScreen').classList.remove('hidden');displayedList=true}function showBot(){by('listScreen').classList.add('hidden');by('chatScreen').classList.remove('hidden');displayedList=false;render()}
by('backToChats').addEventListener('click',showChats);by('enterBot').addEventListener('click',showBot);by('openContacts').addEventListener('click',()=>choose('contacts'));
by('searchInput').addEventListener('input',e=>{by('enterBot').style.display='спорт мордовии bot max'.includes(e.target.value.toLowerCase())?'flex':'none'});
let sheet=null;
function closeSheet(){if(sheet){sheet.remove();sheet=null}}
function showSheet(title,options){closeSheet();const mask=document.createElement('div');mask.className='sheet-backdrop';mask.addEventListener('click',e=>{if(e.target===mask)closeSheet()});const panel=document.createElement('div');panel.className='sheet';const grab=document.createElement('div');grab.className='grab';panel.append(grab);const titleEl=document.createElement('div');titleEl.className='sheet-head';const h=document.createElement('strong');h.textContent=title;const x=document.createElement('button');x.className='iconbtn';x.append(icon('x'));x.addEventListener('click',closeSheet);titleEl.append(h,x);panel.append(titleEl);options.forEach(option=>{const btn=document.createElement('button');btn.className='sheet-option';btn.append(icon(option[0]));const span=document.createElement('span');span.textContent=option[1];btn.append(span);btn.addEventListener('click',()=>{closeSheet();option[2]()});panel.append(btn)});mask.append(panel);by('overlayRoot').append(mask);sheet=mask}
function toast(t){const el=by('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2100)}
function about(){showSheet('Спорт Мордовии',[['info','Информационный помощник Минспорта РМ',()=>toast('Бот для жителей Республики Мордовия')],['home','Главное меню',()=>{showBot();home()}],['moon',document.body.classList.contains('dark')?'Светлая тема':'Тёмная тема',toggleTheme]])}
function toggleTheme(){document.body.classList.toggle('dark');const theme=document.querySelector('meta[name="theme-color"]');theme.content=document.body.classList.contains('dark')?'#161b27':'#ffffff'}
by('openMore').addEventListener('click',()=>showSheet('Спорт Мордовии',[['home','Главное меню',home],['phone','Контактные данные',()=>choose('contacts')],['moon',document.body.classList.contains('dark')?'Светлая тема':'Тёмная тема',toggleTheme],['info','О боте',about]]));
by('plusButton').addEventListener('click',()=>showSheet('Быстрый переход',[['home','Главное меню',home],['chat','Афиша мероприятий',()=>choose('events')],['info','Комплекс ГТО',()=>choose('gto')]]));
by('micButton').addEventListener('click',()=>toast('Напишите сообщение текстом'));
by('chatsMore').addEventListener('click',()=>showSheet('MAX',[['chat','Открыть чат',showBot],['moon',document.body.classList.contains('dark')?'Светлая тема':'Тёмная тема',toggleTheme]]));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.tab!=='Чаты')toast('Выберите чат «Спорт Мордовии»')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(sheet)closeSheet();else if(displayedList)showBot();else back()}});
window.addEventListener('popstate',()=>{if(sheet)closeSheet();else if(displayedList)showBot();else back()});
render();
})();
</script>
</body>
</html>
